name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  engine-test:
    name: Engine Unit & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - name: Install dependencies
        working-directory: engine
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest (Fast Suite)
        working-directory: engine
        run: |
          pytest -m "not slow" -q

  web-check:
    name: Web TypeScript & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint Source
        working-directory: web
        run: npx eslint src

      - name: Build Next.js (Standalone)
        working-directory: web
        env:
          PF_API_URL: https://takomo-engine-695226291083.europe-north1.run.app
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
