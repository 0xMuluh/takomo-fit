name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: sharp-bulwark-488307-i0
  REGION: europe-north1
  REGISTRY: europe-north1-docker.pkg.dev/sharp-bulwark-488307-i0/cloud-run-source-deploy

jobs:
  deploy-engine:
    name: Build & Deploy Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet

      - name: Build & Push Engine Image
        working-directory: engine
        run: |
          IMAGE="${{ env.REGISTRY }}/takomo-engine:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${{ env.REGISTRY }}/takomo-engine:latest" .
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/takomo-engine:latest"

      - name: Deploy Engine to Cloud Run
        run: |
          IMAGE="${{ env.REGISTRY }}/takomo-engine:${{ github.sha }}"
          gcloud run deploy takomo-engine \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "$IMAGE" \
            --max-instances 1 \
            --concurrency 80 \
            --quiet

  deploy-web:
    name: Build & Deploy Web
    needs: deploy-engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet

      - name: Build & Push Web Image
        working-directory: web
        run: |
          IMAGE="${{ env.REGISTRY }}/takomo-web:${{ github.sha }}"
          docker build \
            --build-arg PF_API_URL=https://takomo-engine-695226291083.europe-north1.run.app \
            -t "$IMAGE" -t "${{ env.REGISTRY }}/takomo-web:latest" .
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/takomo-web:latest"

      - name: Deploy Web to Cloud Run
        run: |
          IMAGE="${{ env.REGISTRY }}/takomo-web:${{ github.sha }}"
          gcloud run deploy takomo-web \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "$IMAGE" \
            --concurrency 80 \
            --quiet
